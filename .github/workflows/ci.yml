
name: Microservices CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required for GitHub OIDC
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "979700391724"
  ECR_REPOSITORY: microse-service-project
  ECR_REGISTRY: 979700391724.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java 21
      # --------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # --------------------------------------------------
      # 3. Verify Java and Maven
      # --------------------------------------------------
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # --------------------------------------------------
      # 4. Build Auth Service
      # --------------------------------------------------
      - name: Build Auth Service
        working-directory: services/auth-service
        run: |
          mvn clean package
          ls -lh target/*.jar

      # --------------------------------------------------
      # 5. Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::979700391724:role/GitHubActionsECRRole
          aws-region: us-east-1
          role-session-name: GitHubActionsECR

      # --------------------------------------------------
      # 6. Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------
      # 7. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 8. Build Web UI image
      # --------------------------------------------------
      - name: Build Web UI image
        working-directory: frontend
        run: |
          docker build -t web-ui-image:latest .

      # --------------------------------------------------
      # 9. Build Analytics image
      # --------------------------------------------------
      - name: Build Analytics image
        working-directory: services/analytics-service
        run: |
          docker build -t analytics-service:latest .

      # --------------------------------------------------
      # 10. Build Auth image
      # --------------------------------------------------
      - name: Build Auth image
        working-directory: services/auth-service
        run: |
          docker build -t auth-service:latest .

      # --------------------------------------------------
      # 11. Build Catalog image
      # --------------------------------------------------
      - name: Build Catalog image
        working-directory: services/catalog-service
        run: |
          docker build -t catalog-service:latest .

      # --------------------------------------------------
      # 12. Build Inventory image
      # --------------------------------------------------
      - name: Build Inventory image
        working-directory: services/inventory-service
        run: |
          docker build -t inventory-service:latest .

      # --------------------------------------------------
      # 13. Build Notification image
      # --------------------------------------------------
      - name: Build Notification image
        working-directory: services/notification-service
        run: |
          docker build -t notification-service:latest .

      # --------------------------------------------------
      # 14. Build Order image
      # --------------------------------------------------
      - name: Build Order image
        working-directory: services/order-service
        run: |
          docker build -t order-service:latest .

      # --------------------------------------------------
      # 15. Build Payment image
      # --------------------------------------------------
      - name: Build Payment image
        working-directory: services/payment-service
        run: |
          docker build -t payment-service:latest .

      # --------------------------------------------------
      # 16. Build PostgreSQL image
      # --------------------------------------------------
      - name: Build PostgreSQL image
        working-directory: database
        run: |
          docker build -t postgres:latest .

      # --------------------------------------------------
      # 17. Install Trivy
      # --------------------------------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # --------------------------------------------------
      # 18. Trivy security scan
      # --------------------------------------------------
      - name: Trivy Scan
        run: |
          trivy image web-ui-image:latest
          trivy image analytics-service:latest
          trivy image auth-service:latest
          trivy image postgres:latest
          trivy image payment-service:latest
          trivy image notification-service:latest
          trivy image inventory-service:latest
          trivy image catalog-service:latest
          trivy image order-service:latest

      # --------------------------------------------------
      # 19. Tag images for ECR
      # --------------------------------------------------
      - name: Tag images for ECR
        run: |

          docker tag web-ui-image:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag analytics-service:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag auth-service:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag postgres:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag payment-service:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag notification-service:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag inventory-service:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag catalog-service:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag order-service:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # --------------------------------------------------
      # 20. Push images to ECR
      # --------------------------------------------------
      - name: Push images to ECR
        run: |

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:web-ui-image-$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:analytics-service-$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:auth-service-$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:postgres-$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:payment-service-$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:notification-service-$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:inventory-service-$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:catalog-service-$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:order-service-$IMAGE_TAG

      # --------------------------------------------------
      # 21. Update GitOps repository
      # --------------------------------------------------
      - name: Update Kubernetes manifests
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |

          IMAGE_TAG="${GITHUB_SHA::7}"

          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/Tejkiran-devopsAi/microservice-project-yml.git gitops

          cd gitops

          sed -i "s|image: .*microse-service-project:analytics-service.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:analytics-service-$IMAGE_TAG|" k8s/deployment/analytics.yaml

          sed -i "s|image: .*microse-service-project:auth-service.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:auth-service-$IMAGE_TAG|" k8s/deployment/authentication.yml

          sed -i "s|image: .*microse-service-project:catalog-service.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:catalog-service-$IMAGE_TAG|" k8s/deployment/catalog.yaml

          sed -i "s|image: .*microse-service-project:inventory-service.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:inventory-service-$IMAGE_TAG|" k8s/deployment/inventory.yaml

          sed -i "s|image: .*microse-service-project:notification-service.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:notification-service-$IMAGE_TAG|" k8s/deployment/notification.yaml

          sed -i "s|image: .*microse-service-project:order-service.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:order-service-$IMAGE_TAG|" k8s/deployment/order.yaml

          sed -i "s|image: .*microse-service-project:payment-service.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:payment-service-$IMAGE_TAG|" k8s/deployment/payments.yml

          sed -i "s|image: .*microse-service-project:web-ui-image.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:web-ui-image-$IMAGE_TAG|" k8s/deployment/web-ui.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment/

          git commit -m "Update images to ${IMAGE_TAG}" || echo "No changes to commit"

          git push origin main
