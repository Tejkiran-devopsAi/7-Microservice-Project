server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8081/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/catalog/ {
        proxy_pass http://catalog-service:8082/;
    }

    location /api/inventory/ {
        proxy_pass http://inventory-service:8083/;
    }

    location /api/orders/ {
        proxy_pass http://order-service:8084/;
    }

    location /api/payments/ {
        proxy_pass http://payments-service:8085/;
    }

    location /api/notifications/ {
        proxy_pass http://notification-service:8086/;
    }

    location /api/analytics/ {
        proxy_pass http://analytics-service:8087/;
    }
}